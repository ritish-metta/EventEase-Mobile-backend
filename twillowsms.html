<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SMS Alert Monitor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0f0404;
      color: #f0d0d0;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
    }

    header {
      background: #1a0505;
      border-bottom: 1px solid #5a1010;
      padding: 16px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 20px;
      font-weight: 600;
      color: #ff4444;
      letter-spacing: 1px;
    }

    header p {
      font-size: 11px;
      color: #7a3333;
      margin-top: 2px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #cc4444;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff4444;
      animation: blink 1.4s infinite;
    }

    .dot.off { background: #555; animation: none; }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      padding: 24px 28px 0;
    }

    .stat {
      background: #1a0505;
      border: 1px solid #3a0a0a;
      border-radius: 10px;
      padding: 18px 20px;
    }

    .stat-label {
      font-size: 11px;
      color: #7a3333;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 700;
      color: #ff4444;
    }

    .stat-value.muted { color: #cc8888; }
    .stat-value.good  { color: #ff6666; }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 28px 12px;
    }

    .toolbar span {
      font-size: 13px;
      color: #7a3333;
    }

    .btn {
      background: transparent;
      border: 1px solid #5a1010;
      color: #cc4444;
      padding: 7px 16px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      margin-left: 8px;
    }

    .btn:hover {
      background: #2a0808;
      border-color: #ff4444;
      color: #ff4444;
    }

    .list {
      padding: 0 28px 32px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card {
      background: #1a0505;
      border: 1px solid #3a0a0a;
      border-radius: 10px;
      padding: 14px 18px;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .card.unread {
      border-left: 3px solid #ff4444;
      border-radius: 0 10px 10px 0;
    }

    .card:hover { border-color: #7a2020; }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .card-from {
      font-size: 13px;
      font-weight: 600;
      color: #ff6666;
    }

    .card-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge {
      font-size: 10px;
      padding: 2px 9px;
      border-radius: 99px;
      background: #3a0a0a;
      color: #ff4444;
      font-weight: 600;
      border: 1px solid #5a1010;
    }

    .badge.read {
      background: #140404;
      color: #5a3333;
      border-color: #2a1010;
    }

    .card-time {
      font-size: 11px;
      color: #5a3333;
      font-family: monospace;
    }

    .card-msg {
      font-size: 15px;
      color: #e0c0c0;
      line-height: 1.5;
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #5a2020;
    }

    .empty .icon { font-size: 40px; margin-bottom: 12px; }
    .empty p { font-size: 13px; }

    .err-bar {
      margin: 12px 28px 0;
      background: #2a0808;
      border: 1px solid #7a1010;
      color: #ff6666;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
    }

    @media (max-width: 600px) {
      .stats { grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .stats { padding: 16px 16px 0; }
      .toolbar, .list { padding-left: 16px; padding-right: 16px; }
    }
  </style>
</head>
<body>

<header>
  <div>
    <h1>📲 SMS Alert Monitor</h1>
    <p>ESIM364 · TWILIO GATEWAY</p>
  </div>
  <div class="status">
    <div class="dot" id="dot"></div>
    <span id="status-text">Connecting...</span>
  </div>
</header>

<div class="stats">
  <div class="stat">
    <div class="stat-label">Total</div>
    <div class="stat-value" id="sTotal">—</div>
  </div>
  <div class="stat">
    <div class="stat-label">Unread</div>
    <div class="stat-value muted" id="sUnread">—</div>
  </div>
  <div class="stat">
    <div class="stat-label">Read</div>
    <div class="stat-value good" id="sRead">—</div>
  </div>
</div>

<div id="errBar" class="err-bar"></div>

<div class="toolbar">
  <span id="lastRefresh">—</span>
  <div>
    <button class="btn" onclick="load()">↻ Refresh</button>
    <button class="btn" onclick="clearAll()">✕ Clear All</button>
  </div>
</div>

<div class="list" id="list">
  <div class="empty">
    <div class="icon">📭</div>
    <p>Loading alerts...</p>
  </div>
</div>

<script>
  const BASE = 'https://eventease-mobile-backend.onrender.com';
  let alerts = [];

  async function load() {
    try {
      const r = await fetch(BASE + '/api/twilio/alerts');
      const d = await r.json();
      alerts = d.alerts || [];
      render();
      document.getElementById('dot').className = 'dot';
      document.getElementById('status-text').textContent = 'Live';
      document.getElementById('errBar').style.display = 'none';
      document.getElementById('lastRefresh').textContent =
        'Last updated: ' + new Date().toLocaleTimeString();
    } catch (e) {
      document.getElementById('dot').className = 'dot off';
      document.getElementById('status-text').textContent = 'Offline';
      document.getElementById('errBar').textContent = '⚠ Could not reach server: ' + e.message;
      document.getElementById('errBar').style.display = 'block';
    }
  }

  function render() {
    const unread = alerts.filter(a => !a.read).length;
    document.getElementById('sTotal').textContent  = alerts.length;
    document.getElementById('sUnread').textContent = unread;
    document.getElementById('sRead').textContent   = alerts.length - unread;

    const list = document.getElementById('list');
    if (!alerts.length) {
      list.innerHTML = `<div class="empty"><div class="icon">📭</div><p>No alerts yet. Waiting for messages from ESIM364...</p></div>`;
      return;
    }

    list.innerHTML = alerts.map(a => {
      const t = new Date(a.timestamp).toLocaleString();
      return `
        <div class="card ${a.read ? '' : 'unread'}" onclick="markRead('${a.id}', this)">
          <div class="card-top">
            <span class="card-from">${a.from}</span>
            <div class="card-right">
              <span class="badge ${a.read ? 'read' : ''}">${a.read ? 'READ' : 'NEW'}</span>
              <span class="card-time">${t}</span>
            </div>
          </div>
          <div class="card-msg">${a.message}</div>
        </div>`;
    }).join('');
  }

  async function markRead(id, el) {
    try {
      await fetch(BASE + '/api/twilio/alerts/' + id + '/read', { method: 'PUT' });
      const a = alerts.find(x => x.id === id);
      if (a) { a.read = true; render(); }
    } catch (e) { console.error(e); }
  }

  async function clearAll() {
    if (!confirm('Clear all alerts?')) return;
    try {
      await fetch(BASE + '/api/twilio/alerts', { method: 'DELETE' });
      alerts = [];
      render();
    } catch (e) {
      alert('Failed to clear: ' + e.message);
    }
  }

  load();
  setInterval(load, 15000);
</script>
</body>
</html>
