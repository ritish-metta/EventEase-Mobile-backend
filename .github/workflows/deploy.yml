name: CI/CD - Deploy OpsEdge to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Install & check
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          node --check server.js
          for f in features/*.js public/js/*.js; do node --check "$f"; done

      # Deploy gate: set "enabled": false in deploy.json to skip deploying
      - name: Read deploy gate
        id: gate
        run: |
          ENABLED=$(node -p "require('./deploy.json').enabled === false ? 'false' : 'true'")
          echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"
          echo "Deploy enabled: $ENABLED"

  deploy:
    name: Deploy to instance
    needs: build
    # Two off switches, either one set to false skips the deploy:
    #   1. deploy.json → "enabled": false            (in the code)
    #   2. GitHub repo variable DEPLOY_ENABLED=false (Settings → Secrets and variables → Actions → Variables)
    if: needs.build.outputs.enabled == 'true' && vars.DEPLOY_ENABLED != 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            DIR="$HOME/opsedge"
            # first deploy: get the code
            if [ ! -d "$DIR/.git" ]; then
              git clone "https://github.com/${{ github.repository }}.git" "$DIR"
            fi
            cd "$DIR"
            git fetch origin main
            git reset --hard origin/main
            bash install.sh

            # health check: fail the pipeline if the panel doesn't come up
            PORT=$(grep -E '^OPS_PORT=' .env | cut -d= -f2)
            for i in $(seq 1 15); do
              if curl -sf "http://localhost:${PORT:-7000}/api/health" > /dev/null; then
                echo "✅ OpsEdge is up"
                exit 0
              fi
              sleep 2
            done
            echo "❌ OpsEdge did not respond after deploy"
            pm2 list
            pm2 logs ops-agent --lines 40 --nostream
            exit 1
