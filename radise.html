<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Notes Cache Dashboard</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; background:#0f172a; color:#e2e8f0; }
  h2 { color:#38bdf8; }
  textarea { width:100%; height:80px; padding:10px; border-radius:8px; border:1px solid #334155; background:#1e293b; color:#e2e8f0; }
  button { margin-top:10px; padding:10px 18px; border:none; border-radius:8px; background:#38bdf8; color:#0f172a; font-weight:bold; cursor:pointer; }
  button:hover { background:#0ea5e9; }
  .note { background:#1e293b; padding:10px 14px; border-radius:8px; margin-top:10px; }
  .meta { font-size:12px; color:#94a3b8; margin-top:6px; }
  .source { font-size:13px; margin-top:14px; color:#facc15; }
</style>
</head>
<body>
  <h2>📝 Notes Cache Dashboard</h2>

  <textarea id="textInput" placeholder="Type something to save..."></textarea><br>
  <button onclick="uploadNote()">Upload to DB</button>
  <button onclick="loadNotes()">Refresh List</button>

  <div class="source" id="source"></div>
  <div id="notes"></div>

<script>
  const API = 'http://localhost:5000/api/notes';

  async function uploadNote() {
    const text = document.getElementById('textInput').value;
    if (!text.trim()) return alert('Type something first');

    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    const data = await res.json();
    if (data.success) {
      document.getElementById('textInput').value = '';
      loadNotes();
    } else {
      alert(data.message || 'Upload failed');
    }
  }

  async function loadNotes() {
    const res = await fetch(API);
    const data = await res.json();

    document.getElementById('source').innerText =
      `Data served from: ${data.source === 'cache' ? 'Redis cache ⚡' : 'MongoDB 🗄️'}`;

    const container = document.getElementById('notes');
    container.innerHTML = '';
    (data.notes || []).forEach(n => {
      const div = document.createElement('div');
      div.className = 'note';
      div.innerHTML = `${n.text}<div class="meta">${new Date(n.createdAt).toLocaleString()}</div>`;
      container.appendChild(div);
    });
  }

  loadNotes();
</script>
</body>
</html>
